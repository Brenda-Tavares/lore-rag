version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lore_db
    environment:
      POSTGRES_USER: lore_user
      POSTGRES_PASSWORD: lore_pass
      POSTGRES_DB: lore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore_user -d lore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lore_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: